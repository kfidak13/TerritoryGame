# Borderfall on Fly.io: one always-on machine running the Docker image
# (nginx in front of the game server and its workers, see Dockerfile). Fly
# terminates HTTPS and forwards to nginx on port 80; WebSockets pass through.
#
# Deploy with `npm run deploy:fly` (it stamps the build with the git commit,
# which clients must match to join). Secrets, set once with `fly secrets set`:
#   DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET   Discord sign-in
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET     Google sign-in
#   BORDERFALL_ADMIN_EMAIL     the email of the one account that is admin
#   BORDERFALL_ADMIN_PASSWORD  the password the Admin button asks for
#   API_KEY                    any long random string (game servers -> accounts)

app = "borderfall"
primary_region = "sjc"

[env]
  GAME_ENV = "prod"
  NUM_WORKERS = "2"
  # First letter of every game id this server mints; any letter works with a
  # single server.
  INSTANCE_LETTER = "a"
  # Cloudflare's always-pass test key until a real Turnstile key is set up.
  TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
  # The address players use; switch to your own domain once it points here.
  DOMAIN = "borderfall.fly.dev"
  # Borderfall's own accounts (src/server/accounts), stored on the volume.
  BORDERFALL_ACCOUNTS = "1"

# Accounts and stats live in /data/accounts.db on this 1 GB volume.
[mounts]
  source = "borderfall_data"
  destination = "/data"

[http_service]
  internal_port = 80
  force_https = true
  # Public lobbies run around the clock, so the machine never sleeps.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
